<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية - جامعة النيل الأبيض</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #ff5722;
            --primary-gradient: linear-gradient(135deg, #ff5722 0%, #f4511e 100%);
            --border-color: #f1f5f9;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.95);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #ff5722;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        
        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: var(--text-main);
            transition: background 0.3s ease, color 0.3s ease;
        }

        .main-container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 480px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            text-align: center;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .university-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            background: var(--primary-gradient);
            color: white;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 0.9rem;
            box-shadow: 0 4px 12px rgba(255, 87, 34, 0.3);
            flex-shrink: 0;
        }

        .brand-info {
            text-align: right;
        }

        .brand-info h1 {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.2;
        }

        .brand-info span {
            font-size: 0.7rem;
            color: var(--primary);
            font-weight: 600;
        }

        .icon-btn {
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: none;
            transition: 0.2s;
        }
        [data-theme="dark"] .icon-btn { background: rgba(255, 255, 255, 0.05); }
        .icon-btn:hover { border-color: var(--primary); }

        .welcome-hero {
            background: var(--primary-gradient);
            border-radius: 20px;
            padding: 30px 20px;
            color: white;
            box-shadow: 0 12px 25px rgba(255, 87, 34, 0.25);
        }

        .welcome-hero h2 {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .welcome-hero p {
            font-size: 0.85srem;
            opacity: 0.9;
            font-weight: 500;
        }

        .action-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-primary-custom {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 6px 15px rgba(255, 87, 34, 0.3);
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-primary-custom:hover { opacity: 0.95; transform: translateY(-1px); }

        .btn-secondary-custom {
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px;
            border-radius: 14px;
            font-size: 0.90rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        [data-theme="dark"] .btn-secondary-custom { background: rgba(255, 255, 255, 0.05); }
        .btn-secondary-custom:hover { border-color: var(--primary); }
    </style>
</head>
<body>

    <script>
        // قراءة الوضع المحفوظ مسبقاً لمنع أي لخبطة عند التنقل بين الصفحات
        const savedTheme = localStorage.getItem('site_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.body.setAttribute('data-theme', savedTheme);
    </script>

    <div class="main-container">
        <!-- الهيدر العلوي -->
        <header class="top-nav">
            <button class="icon-btn" id="theme-toggle" type="button" title="الوضع الليلي">🌙</button>
            <div class="university-brand">
                <div class="brand-info">
                    <h1>جامعة النيل الأبيض</h1>
                    <span>بوابة الطلاب الإلكترونية</span>
                </div>
                <div class="brand-logo">IT</div>
            </div>
        </header>

        <!-- الترحيب -->
        <div class="welcome-hero">
            <h2>مرحباً بك في البوابة الأكاديمية</h2>
            <p>منصة إدارة الخدمات التعليمية واللوحة الذكية للطلاب</p>
        </div>

        <!-- الأزرار التوجيهية -->
        <div class="action-links">
            <a href="dashboard.html" class="btn-primary-custom">الانتقال إلى لوحة التحكم 🚀</a>
            <a href="login.html" class="btn-secondary-custom">تسجيل الدخول / الخروج</a>
        </div>
    </div>

    <script>
        const themeBtn = document.getElementById('theme-toggle');
        const bodyTag = document.body;

        // ضبط الأيقونة حسب الوضع الحالي
        if (bodyTag.getAttribute('data-theme') === 'dark') {
            themeBtn.textContent = '☀️';
        } else {
            themeBtn.textContent = '🌙';
        }

        // التبديل وحفظ الوضع في التخزين المحلي
        themeBtn.addEventListener('click', function(e) {
            e.preventDefault();
            let currentTheme = bodyTag.getAttribute('data-theme');
            if (currentTheme === 'light') {
                bodyTag.setAttribute('data-theme', 'dark');
                localStorage.setItem('site_theme', 'dark');
                themeBtn.textContent = '☀️';
            } else {
                bodyTag.setAttribute('data-theme', 'light');
                localStorage.setItem('site_theme', 'light');
                themeBtn.textContent = '🌙';
            }
        });
    </script>
</body>
</html>
