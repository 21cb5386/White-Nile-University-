<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الأكاديمية - جامعة النيل الأبيض</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #ff5722;
            --primary-gradient: linear-gradient(135deg, #ff5722 0%, #f4511e 100%);
            --border-color: #f1f5f9;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.95);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #ff5722;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        
        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: var(--text-main);
            transition: background 0.3s ease, color 0.3s ease;
        }

        .dashboard-container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 480px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .university-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            background: var(--primary-gradient);
            color: white;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 0.9rem;
            box-shadow: 0 4px 12px rgba(255, 87, 34, 0.3);
            flex-shrink: 0;
        }

        .brand-info h1 {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.2;
        }

        .brand-info span {
            font-size: 0.7rem;
            color: var(--primary);
            font-weight: 600;
        }

        .icon-btn {
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: none;
            transition: 0.2s;
        }
        [data-theme="dark"] .icon-btn { background: rgba(255, 255, 255, 0.05); }
        .icon-btn:hover { border-color: var(--primary); }

        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 7px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .logout-btn:hover { background: rgba(239, 68, 68, 0.25); }

        .welcome-card {
            background: var(--primary-gradient);
            border-radius: 20px;
            padding: 24px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 25px rgba(255, 87, 34, 0.25);
        }

        .welcome-header h2 {
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .welcome-header p {
            font-size: 0.82rem;
            opacity: 0.9;
            font-weight: 500;
        }

        .student-badge-box {
            margin-top: 18px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .student-badge-box span { font-size: 0.75rem; opacity: 0.9; }
        .student-badge-box strong { font-size: 0.9rem; letter-spacing: 0.5px; font-weight: 800; }

        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 4px;
        }

        .courses-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .course-item {
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border-color);
            padding: 14px 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        [data-theme="dark"] .course-item { background: rgba(255, 255, 255, 0.02); }

        .course-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .course-status {
            font-size: 0.72rem;
            font-weight: 700;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <script>
        // تحميل الوضع المحفوظ مسبقاً لمنع أي لخبطة بين الصفحات
        const savedTheme = localStorage.getItem('site_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.body.setAttribute('data-theme', savedTheme);
    </script>

    <div class="dashboard-container">
        <header class="top-nav">
            <div class="nav-actions">
                <button class="logout-btn" id="logout-btn" type="button">خروج</button>
                <button class="icon-btn" id="theme-toggle" type="button" title="الوضع الليلي">🌙</button>
                <a href="index.html" class="icon-btn" title="الرئيسية">🏠</a>
            </div>
            <div class="university-brand">
                <div class="brand-info">
                    <h1>جامعة النيل الأبيض</h1>
                    <span>لوحة التحكم الأكاديمية</span>
                </div>
                <div class="brand-logo">IT</div>
            </div>
        </header>

        <div class="welcome-card">
            <div class="welcome-header">
                <h2>مرحباً بك، محمود عبدالله آدم محمد</h2>
                <p>قسم تقانة المعلومات - السمستر الثاني</p>
            </div>
            <div class="student-badge-box">
                <span>الرقم الجامعي</span>
                <strong>7273688-2025</strong>
            </div>
        </div>

        <div class="section-title">
            <span>📚</span> مقرّراتك الأكاديمية الحالية
        </div>

        <div class="courses-list">
            <div class="course-item">
                <span class="course-name">هيكل البيانات والخوارزميات</span>
                <span class="course-status">✓ نشط</span>
            </div>
            <div class="course-item">
                <span class="course-name">تطوير وتصميم الويب المتقدم</span>
                <span class="course-status">✓ نشط</span>
            </div>
            <div class="course-item">
                <span class="course-name">الشبكات وأنظمة الاتصالات</span>
                <span class="course-status">✓ نشط</span>
            </div>
        </div>
    </div>

    <script>
        const themeBtn = document.getElementById('theme-toggle');
        const bodyTag = document.body;

        // تحديث أيقونة الزر بناءً على الوضع الحالي
        if (bodyTag.getAttribute('data-theme') === 'dark') {
            themeBtn.textContent = '☀️';
        } else {
            themeBtn.textContent = '🌙';
        }

        // تبديل وحفظ الوضع في ذاكرة التخزين (localStorage)
        themeBtn.addEventListener('click', function(e) {
            e.preventDefault();
            let currentTheme = bodyTag.getAttribute('data-theme');
            if (currentTheme === 'light') {
                bodyTag.setAttribute('data-theme', 'dark');
                localStorage.setItem('site_theme', 'dark');
                themeBtn.textContent = '☀️';
            } else {
                bodyTag.setAttribute('data-theme', 'light');
                localStorage.setItem('site_theme', 'light');
                themeBtn.textContent = '🌙';
            }
        });

        // تفعيل زر تسجيل الخروج بصورة مؤكدة
        const logoutBtn = document.getElementById('logout-btn');
        logoutBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            // لو صفحة الدخول باسم مختلف غير login.html غيرها هنا
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
