<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة تقانة المعلومات - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #115e59;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background: var(--card-bg); width: 100%; max-width: 420px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header-top select { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-weight: 600; cursor: pointer; }
        h1 { font-size: 1.5rem; font-weight: 900; color: var(--primary); margin-bottom: 5px; }
        p.subtitle { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; position: relative; }
        .form-group label { display: block; font-size: 0.88rem; font-weight: 700; margin-bottom: 8px; }
        .input-wrapper { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); overflow: hidden; padding: 0 12px; }
        .input-wrapper i { color: var(--text-muted); margin-left: 10px; font-size: 1rem; }
        .input-wrapper input { width: 100%; padding: 12px 0; border: none; background: transparent; outline: none; font-size: 0.95rem; color: var(--text); }
        .eye-icon { cursor: pointer; color: var(--text-muted); padding: 5px; }
        .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 800; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-submit:hover { background: var(--primary-dark); }
        .switch-mode { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted); }
        .switch-mode a { color: var(--primary); font-weight: 700; text-decoration: none; cursor: pointer; }
        .hidden-view { display: none !important; }
        .extras-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; margin-top: 10px; }
        .extras-row a { color: var(--primary); text-decoration: none; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <div class="login-card" id="main-container">
        <div class="header-top">
            <h1 id="form-title">بوابة تقانة المعلومات</h1>
            <select id="lang-select" onchange="changeLanguage()">
                <option value="ar">العربية</option>
            </select>
        </div>
        <p class="subtitle" id="form-subtitle">تسجيل الدخول الأكاديمي للطلاب.</p>

        <div id="auth-form-container">
            <!-- حقول التسجيل / الدخول -->
            <div class="form-group signup-field hidden-view">
                <label id="lbl-name">الاسم الكامل</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="fullname" placeholder="أدخل اسمك الكامل">
                </div>
            </div>

            <div class="form-group signup-field hidden-view">
                <label id="lbl-id">الرقم الجامعي (ID)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="studentid" placeholder="IT-2026-XXXX">
                </div>
            </div>

            <div class="form-group signup-field hidden-view">
                <label id="lbl-semester">السمستر الحالي</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-book"></i>
                    <input type="text" id="semester" placeholder="السمستر الثاني">
                </div>
            </div>

            <div class="form-group">
                <label id="lbl-email">البريد الإلكتروني الجامعي</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email-input" placeholder="student@fit.edu">
                </div>
            </div>

            <div class="form-group">
                <label id="lbl-password">كلمة المرور</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="pass-input" placeholder="********">
                    <i class="fa-solid fa-eye eye-icon" onmousedown="showPassword('pass-input')" onmouseup="hidePassword('pass-input')"></i>
                </div>
            </div>

            <!-- حقل تأكيد كلمة المرور عند إنشاء حساب -->
            <div class="form-group signup-field hidden-view">
                <label>تأكيد كلمة المرور</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirm-pass-input" placeholder="********">
                </div>
            </div>

            <div class="extras-row" id="login-extras">
                <label><input type="checkbox"> <span id="lbl-remember">تذكرني</span></label>
                <a id="lnk-forgot">نسيت كلمة المرور؟</a>
            </div>

            <button class="btn-submit" id="submit-btn" onclick="handleSubmit()">تسجيل الدخول</button>

            <div class="switch-mode">
                <span id="switch-text">ليس لديك حساب؟</span> 
                <a id="switch-btn" onclick="toggleMode()">سجل الآن</a>
            </div>
        </div>

        <!-- واجهة استعادة كلمة المرور (مخفية افتراضياً) -->
        <div id="forgot-flow-container" class="hidden-view">
            <h3 style="margin-bottom: 15px; color: var(--primary);">استعادة كلمة المرور</h3>
            <div id="step-captcha">
                <p style="font-size: 0.85rem; margin-bottom: 10px;">يرجى التحقق من أنك لست روبوت:</p>
                <button class="btn-submit" onclick="triggerRealCaptcha()">تحقق من الكابتشا</button>
            </div>
            <div id="step-email" class="hidden-view" style="margin-top: 15px;">
                <input type="email" id="recovery-email-input" placeholder="أدخل بريدك الإلكتروني" style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border); margin-bottom:10px;">
                <button class="btn-submit" onclick="sendVerificationCode()">إرسال رمز التحقق</button>
            </div>
            <div id="step-otp" class="hidden-view" style="margin-top: 15px;">
                <input type="text" id="otp-input" placeholder="أدخل رمز OTP المرسل" style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border); margin-bottom:10px;">
                <button class="btn-submit" onclick="verifyOtpCode()">تحقق من الرمز</button>
            </div>
            <div id="step-newpass" class="hidden-view" style="margin-top: 15px;">
                <input type="password" id="new-pass-input" placeholder="كلمة المرور الجديدة" style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border); margin-bottom:10px;">
                <input type="password" id="confirm-new-pass-input" placeholder="تأكيد كلمة المرور" style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border); margin-bottom:10px;">
                <button class="btn-submit" onclick="saveNewPassword()">حفظ كلمة المرور</button>
            </div>
            <div class="switch-mode" style="margin-top: 15px;">
                <a onclick="backToLogin()">العودة لتسجيل الدخول</a>
            </div>
        </div>
    </div>

    <!-- ربط ملف الجافاسكريبت الموحد -->
    <script type="module" src="lab.js"></script>
</body>
</html>
