<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - جامعة النيل الأبيض</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- ربط ملف الـ CSS الخارجي -->
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script>
        // حقن الثيم فوراً لمنع الوميض عند التحميل
        (function() {
            const savedTheme = localStorage.getItem('it_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body data-theme="light">

    <div class="main-container" id="main-container">
        <!-- شريط علوي مبسط -->
        <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border-color); width: 100%;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 35px; height: 35px; background: #ff5722; color: white; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-weight: bold;">IT</div>
                <div>
                    <h1 id="uni-mini-title" style="font-size: 0.95rem; font-weight: 800;">جامعة النيل الأبيض</h1>
                    <span id="uni-mini-sub" style="font-size: 0.65rem; color: #ff5722; font-weight: 600;">بوابة تقانة المعلومات</span>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <select id="lang-select" onchange="changeLanguage()" style="padding: 5px 8px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 11px;">
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                </select>
                <button id="theme-toggle" onclick="toggleTheme()" style="padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); cursor: pointer;">🌙</button>
                <a href="index.html" id="nav-home" style="padding: 6px 12px; background: #ff5722; color: white; border-radius: 8px; text-decoration: none; font-size: 11px; font-weight: bold;">الرئيسية</a>
            </div>
        </header>

        <!-- منطقة نموذج الدخول أو التسجيل -->
        <div style="display: flex; flex: 1; justify-content: center; align-items: center; padding: 20px; width: 100%;">
            <div style="max-width: 420px; width: 100%; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--border-color);">
                
                <!-- حاوية تسجيل الدخول الأساسية -->
                <div id="auth-form-container">
                    <h2 id="form-title" style="font-size: 1.3rem; font-weight: 800; margin-bottom: 5px; color: var(--text-main);">بوابة تقانة المعلومات</h2>
                    <p id="form-subtitle" style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 20px;">تسجيل الدخول الأكاديمي للطلاب.</p>

                    <div style="margin-bottom: 12px;" class="signup-field hidden-view">
                        <label id="lbl-name" style="display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 5px;">الاسم الكامل</label>
                        <input type="text" id="fullname" placeholder="أدخل اسمك الكامل" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 12px;">
                    </div>

                    <div style="margin-bottom: 12px;" class="signup-field hidden-view">
                        <label id="lbl-id" style="display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 5px;">الرقم الجامعي (ID)</label>
                        <input type="text" id="studentid" placeholder="IT-2026-XXXX" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 12px;">
                    </div>

                    <div style="margin-bottom: 12px;" class="signup-field hidden-view">
                        <label id="lbl-semester" style="display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 5px;">السمستر الحالي</label>
                        <input type="text" id="semester" placeholder="السمستر الثالث" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 12px;">
                    </div>

                    <div style="margin-bottom: 12px;">
                        <label id="lbl-email" style="display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 5px;">البريد الإلكتروني الجامعي</label>
                        <input type="email" id="email-input" placeholder="student@fit.edu" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 12px;">
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label id="lbl-password" style="display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 5px;">كلمة المرور</label>
                        <input type="password" id="pass-input" placeholder="••••••••" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 12px;">
                    </div>

                    <div id="login-extras" style="display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; margin-bottom: 18px;">
                        <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                            <input type="checkbox"> <span id="lbl-remember">تذكرني</span>
                        </label>
                        <a href="#" id="lnk-forgot" onclick="startForgotPassword()" style="color: #ff5722; text-decoration: none; font-weight: 600;">نسيت كلمة المرور؟</a>
                    </div>

                    <button id="submit-btn" onclick="handleSubmit()" style="width: 100%; padding: 11px; background: #ff5722; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px; box-shadow: 0 4px 12px rgba(255,87,34,0.3);">تسجيل الدخول</button>

                    <div style="text-align: center; margin-top: 15px; font-size: 0.78rem;">
                        <span id="switch-text">ليس لديك حساب؟</span> 
                        <a href="#" id="switch-btn" onclick="toggleMode()" style="color: #ff5722; font-weight: bold; text-decoration: none; margin-right: 4px;">سجل الآن</a>
                    </div>
                </div>

                <!-- تدفق استعادة كلمة المرور (مخفي افتراضياً) -->
                <div id="forgot-flow-container" class="hidden-view">
                    <h3 style="font-size: 1.1rem; font-weight: 800; margin-bottom: 10px; color: var(--text-main);">استعادة كلمة المرور</h3>
                    
                    <!-- خطوة الكابتشا -->
                    <div id="step-captcha" style="margin-bottom: 15px;">
                        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px;">الرجاء تأكيد أنك لست روبوت:</p>
                        <div onclick="triggerRealCaptcha()" style="display: flex; align-items: center; justify-content: space-between; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; background: rgba(0,0,0,0.01);">
                            <div style="display: flex; align-items: center; gap: 10px; font-size: 0.8rem;">
                                <div style="width: 20px; height: 20px; border: 2px solid #ccc; border-radius: 4px; display: flex; justify-content: center; align-items: center;">
                                    <span id="captcha-check" style="display:none; color: green; font-weight: bold;">✓</span>
                                    <div id="captcha-spinner" style="display:none; width: 12px; height: 12px; border: 2px solid #ff5722; border-top: 2px solid transparent; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
                                </div>
                                <span>أنا لست روبوت (I'm not a robot)</span>
                            </div>
                            <span style="font-size: 0.65rem; color: #888;">reCAPTCHA</span>
                        </div>
                    </div>

                    <!-- خطوة إدخال البريد -->
                    <div id="step-email" class="hidden-view" style="margin-bottom: 15px;">
                        <label style="display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 5px;">البريد الإلكتروني المرتبط بالحساب</label>
                        <input type="email" id="recovery-email-input" placeholder="student@fit.edu" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 12px; margin-bottom: 10px;">
                        <button onclick="sendVerificationCode()" style="width: 100%; padding: 10px; background: #ff5722; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px;">إرسال رمز التحقق</button>
                    </div>

                    <!-- خطوة إدخال رمز الـ OTP -->
                    <div id="step-otp" class="hidden-view" style="margin-bottom: 15px;">
                        <label style="display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 5px;">أدخل رمز التحقق المكون من 4 أرقام</label>
                        <input type="text" id="otp-input" placeholder="1234" maxlength="4" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 12px; text-align: center; letter-spacing: 5px; margin-bottom: 10px;">
                        <button onclick="verifyOtpCode()" style="width: 100%; padding: 10px; background: #ff5722; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px;">التحقق من الرمز</button>
                    </div>

                    <!-- خطوة كلمة المرور الجديدة -->
                    <div id="step-newpass" class="hidden-view" style="margin-bottom: 15px;">
                        <label style="display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 5px;">كلمة المرور الجديدة</label>
                        <input type="password" id="new-pass-input" placeholder="••••••••" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 12px; margin-bottom: 8px;">
                        
                        <label style="display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 5px;">تأكيد كلمة المرور الجديدة</label>
                        <input type="password" id="confirm-new-pass-input" placeholder="••••••••" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); font-size: 12px; margin-bottom: 10px;">
                        
                        <button onclick="saveNewPassword()" style="width: 100%; padding: 10px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px;">حفظ وتحديث كلمة المرور</button>
                    </div>

                    <div style="text-align: center; margin-top: 15px;">
                        <a href="#" onclick="backToLogin()" style="font-size: 0.78rem; color: var(--text-muted); text-decoration: none;">← العودة لصفحة تسجيل الدخول</a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- ربط ملف الجافاسكريبت الخارجي الخاص بك (lab.js) -->
    <script src="lab.js"></script>
</body>
</html>
