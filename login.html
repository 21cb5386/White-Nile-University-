<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول الأكاديمي - جامعة النيل الأبيض</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fdf6f0 0%, #faedcd 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1a1a1a;
            --text-muted: #777;
            --primary-color: #ff5722;
            --border-color: #eee;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #121212 0%, #1e1e1e 100%);
            --card-bg: rgba(30, 30, 30, 0.95);
            --text-main: #f3f4f6;
            --text-muted: #aaa;
            --primary-color: #ff5722;
            --border-color: #333;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; transition: background 0.3s, color 0.3s, border-color 0.3s; }
        
        a, button, .extras a, .switch-mode a {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: var(--bg-gradient); padding: 10px; }

        .container {
            display: flex; background: var(--card-bg); backdrop-filter: blur(10px);
            border-radius: 20px; box-shadow: var(--shadow); overflow: hidden;
            max-width: 820px; width: 100%; flex-direction: column; border: 1px solid var(--border-color);
            position: relative;
        }

        .top-nav-bar {
            position: absolute; top: 12px; right: 15px; left: 15px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }

        .university-brand-mini { display: flex; align-items: center; gap: 8px; }
        .mini-logo {
            width: 32px; height: 32px; background: linear-gradient(135deg, #ff5722 0%, #f4511e 100%);
            color: white; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 0.8rem;
        }
        .mini-text h4 { font-size: 0.8rem; font-weight: 800; color: var(--text-main); }
        .mini-text span { font-size: 0.6rem; color: var(--primary-color); display: block; }

        .nav-controls-group { display: flex; align-items: center; gap: 6px; }
        .home-link-btn, .language-bar select, .theme-toggle-btn {
            padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--card-bg); color: var(--text-main); font-size: 11px; cursor: pointer; outline: none; text-decoration: none;
        }

        .animation-side {
            background: linear-gradient(135deg, rgba(255, 237, 216, 0.4) 0%, rgba(255, 216, 177, 0.4) 100%);
            display: flex; justify-content: center; align-items: center; padding: 10px; min-height: 150px; margin-top: 55px;
        }
        #lottie-animation { width: 100%; height: 140px; }

        .form-side { padding: 25px 20px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
        .header-text h2 { margin: 0 0 3px 0; color: var(--text-main); font-size: 20px; font-weight: 800; }
        .header-text p { margin: 0; color: var(--text-muted); font-size: 12px; }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 11px; color: var(--text-main); font-weight: 600; }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper input {
            width: 100%; padding: 10px 35px; border: 2px solid var(--border-color);
            border-radius: 10px; outline: none; font-size: 13px; background: rgba(0,0,0,0.02); color: var(--text-main);
        }
        [data-theme="dark"] .input-wrapper input { background: #252525; }
        .input-wrapper input:focus { border-color: var(--primary-color); }

        .input-icon { position: absolute; right: 12px; font-size: 13px; color: #aaa; pointer-events: none; }
        .toggle-password { position: absolute; left: 12px; cursor: pointer; width: 18px; height: 18px; fill: #aaa; }

        .extras { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .extras label { display: flex; align-items: center; gap: 4px; color: var(--text-muted); cursor: pointer; }
        .extras a { color: var(--primary-color); text-decoration: none; font-weight: 600; cursor: pointer; }

        .action-btn {
            background: linear-gradient(135deg, #ff5722 0%, #f4511e 100%);
            color: white; border: none; padding: 11px; border-radius: 10px;
            font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; display: block; width: 100%;
            box-shadow: 0 6px 15px rgba(255, 87, 34, 0.3); transition: transform 0.15s ease; margin-top: 5px;
        }
        .action-btn:active { transform: scale(0.96); }

        .switch-mode { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 5px; }
        .switch-mode a { color: var(--primary-color); font-weight: bold; cursor: pointer; text-decoration: none; }
        .hidden-view { display: none !important; }

        /* التصميم العالمي الجديد لشكل reCAPTCHA "أنا لست روبوت" الاحترافي */
        .recaptcha-box-global {
            background: #f9f9f9;
            border: 1px solid #d3d3d3;
            border-radius: 6px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 320px;
            width: 100%;
            margin: 15px auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .recaptcha-box-global:hover {
            border-color: #b0b0b0;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
        [data-theme="dark"] .recaptcha-box-global {
            background: #222;
            border-color: #444;
        }

        .recaptcha-left-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .recaptcha-checkbox-custom {
            width: 26px;
            height: 26px;
            background: #fff;
            border: 2px solid #c1c1c1;
            border-radius: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }
        [data-theme="dark"] .recaptcha-checkbox-custom {
            background: #111;
            border-color: #555;
        }

        .recaptcha-check-icon {
            color: #006600;
            font-size: 18px;
            font-weight: bold;
            display: none;
            animation: popIn 0.2s ease;
        }
        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .recaptcha-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #4285f4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .recaptcha-label-text {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            letter-spacing: 0.2px;
        }

        .recaptcha-brand-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .recaptcha-logo-img {
            width: 28px;
            height: 28px;
            opacity: 0.85;
        }
        .recaptcha-brand-right span {
            font-size: 9px;
            color: #777;
            margin-top: 1px;
            font-weight: 600;
        }
        .recaptcha-brand-right a {
            font-size: 8px;
            color: #555;
            text-decoration: none;
        }
        .recaptcha-brand-right a:hover { text-decoration: underline; }

        @media (min-width: 768px) {
            .container { flex-direction: row; max-width: 780px; }
            .animation-side { flex: 1; min-height: auto; margin-top: 0; }
            #lottie-animation { height: 240px; }
            .form-side { flex: 1; justify-content: center; padding: 30px; }
            .top-nav-bar { top: 12px; right: 20px; left: 20px; }
        }
    </style>
</head>
<body data-theme="light">

    <div class="container" id="main-container" dir="rtl">
        <div class="top-nav-bar">
            <div class="university-brand-mini">
                <div class="mini-logo">IT</div>
                <div class="mini-text">
                    <h4 id="uni-mini-title">جامعة النيل الأبيض</h4>
                    <span id="uni-mini-sub">بوابة تقانة المعلومات</span>
                </div>
            </div>

            <div class="nav-controls-group">
                <a href="index.html" class="home-link-btn" id="nav-home">الرئيسية</a>
                <select id="lang-select" onchange="changeLanguage()">
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                </select>
                <button class="theme-toggle-btn" id="theme-toggle" onclick="toggleTheme()" title="الوضع الليلي">🌙</button>
            </div>
        </div>

        <div class="animation-side">
            <div id="lottie-animation"></div>
        </div>

        <div class="form-side">
            <div class="header-text" style="margin-top: 20px;">
                <h2 id="form-title">بوابة تقانة المعلومات</h2>
                <p id="form-subtitle">تسجيل الدخول الأكاديمي للطلاب.</p>
            </div>

            <!-- نموذج تسجيل الدخول / التسجيل -->
            <div id="auth-form-container">
                <div class="input-group signup-field hidden-view" id="name-group">
                    <label id="lbl-name">الاسم الكامل</label>
                    <div class="input-wrapper">
                        <input type="text" id="fullname" placeholder="مثال: محمد أحمد">
                        <span class="input-icon">👤</span>
                    </div>
                </div>

                <div class="input-group signup-field hidden-view" id="id-group">
                    <label id="lbl-id">الرقم الجامعي (ID)</label>
                    <div class="input-wrapper">
                        <input type="text" id="studentid" placeholder="IT-2026-039">
                        <span class="input-icon">🪪</span>
                    </div>
                </div>

                <div class="input-group signup-field hidden-view" id="semester-group">
                    <label id="lbl-semester">السمستر الحالي</label>
                    <div class="input-wrapper">
                        <input type="text" id="semester" placeholder="السمستر الثالث">
                        <span class="input-icon">🎓</span>
                    </div>
                </div>

                <div class="input-group">
                    <label id="lbl-email">البريد الإلكتروني الجامعي</label>
                    <div class="input-wrapper">
                        <input type="email" id="email-input" placeholder="name@example.com">
                        <span class="input-icon">✉️</span>
                    </div>
                </div>

                <div class="input-group">
                    <label id="lbl-password">كلمة المرور</label>
                    <div class="input-wrapper">
                        <input type="password" id="pass-input" placeholder="••••••••">
                        <span class="input-icon">🔒</span>
                        <svg class="toggle-password" viewBox="0 0 24 24" 
                             onpointerdown="showPassword('pass-input', event)" onpointerup="hidePassword('pass-input', event)">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </div>
                </div>

                <div class="extras" id="login-extras">
                    <label><input type="checkbox" id="remember-me-chk"> <span id="lbl-remember">تذكرني</span></label>
                    <a id="lnk-forgot" onclick="startForgotPassword()">نسيت كلمة المرور؟</a>
                </div>

                <button class="action-btn" id="submit-btn" onclick="handleSubmit()">تسجيل الدخول</button>

                <div class="switch-mode">
                    <span id="switch-text">ليس لديك حساب؟</span> 
                    <a id="switch-btn" onclick="toggleMode()">سجل الآن</a>
                </div>
            </div>

            <!-- خطوات استعادة كلمة المرور مع "أنا لست روبوت" العالمية الاحترافية -->
            <div id="forgot-flow-container" class="hidden-view">
                <div id="step-captcha" style="text-align: center;">
                    <p style="font-size: 13px; margin-bottom: 15px; color: var(--text-muted); font-weight: 600;">الرجاء التحقق من هويتك للمتابعة:</p>
                    
                    <!-- التصميم العالمي الاحترافي لـ reCAPTCHA -->
                    <div class="recaptcha-box-global" onclick="triggerRealCaptcha()">
                        <div class="recaptcha-left-content">
                            <div class="recaptcha-checkbox-custom">
                                <div class="recaptcha-spinner" id="captcha-spinner"></div>
                                <span class="recaptcha-check-icon" id="captcha-check">✓</span>
                            </div>
                            <span class="recaptcha-label-text" id="lbl-robot">أنا لست روبوت</span>
                        </div>
                        <div class="recaptcha-brand-right">
                            <svg class="recaptcha-logo-img" viewBox="0 0 48 48">
                                <path fill="#4285F4" d="M36 24c0-1.3-.1-2.5-.3-3.6H24v7h6.8c-.3 1.5-1.1 2.8-2.4 3.7v3.1h3.9c2.3-2.1 3.7-5.2 3.7-9.2z"/>
                                <path fill="#34A853" d="M24 36c3.2 0 6-1.1 8-3l-3.9-3.1c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5h-4v3.2C14.9 33.2 19.1 36 24 36z"/>
                                <path fill="#FBBC05" d="M17.3 26.1c-.2-.7-.4-1.5-.4-2.1s.2-1.4.4-2.1v-3.2h-4c-.8 1.6-1.3 3.4-1.3 5.3s.5 3.7 1.3 5.3l4-3.2z"/>
                                <path fill="#EA4335" d="M24 14.8c1.8 0 3.4.6 4.6 1.8l3.5-3.5C30 11.1 27.2 10 24 10c-4.9 0-9.1 2.8-11.1 6.9l4 3.2c.9-2.9 3.6-5.3 6.7-5.3z"/>
                            </svg>
                            <span>reCAPTCHA</span>
                            <div><a href="#" onclick="return false;">الخصوصية</a> - <a href="#" onclick="return false;">الشروط</a></div>
                        </div>
                    </div>
                </div>

                <div id="step-email" class="hidden-view">
                    <div class="input-group">
                        <label id="lbl-recovery-email">أدخل بريدك الإلكتروني المسجل</label>
                        <div class="input-wrapper">
                            <input type="email" id="recovery-email-input" placeholder="name@example.com">
                            <span class="input-icon">✉️</span>
                        </div>
                    </div>
                    <button class="action-btn" id="btn-send-code" onclick="sendVerificationCode()" style="margin-top: 10px;">إرسال رمز التحقق</button>
                </div>

                <div id="step-otp" class="hidden-view">
                    <div class="input-group">
                        <label id="lbl-otp">أدخل رمز التحقق (4 أرقام)</label>
                        <div class="input-wrapper">
                            <input type="text" id="otp-input" placeholder="1234" maxlength="4">
                            <span class="input-icon">🔑</span>
                        </div>
                    </div>
                    <button class="action-btn" id="btn-verify-otp" onclick="verifyOtpCode()" style="margin-top: 10px;">التحقق من الرمز</button>
                </div>

                <div id="step-newpass" class="hidden-view">
                    <div class="input-group" style="margin-bottom: 8px;">
                        <label id="lbl-new-pass">كلمة المرور الجديدة</label>
                        <div class="input-wrapper">
                            <input type="password" id="new-pass-input" placeholder="••••••••">
                            <span class="input-icon">🔒</span>
                        </div>
                    </div>
                    <div class="input-group">
                        <label id="lbl-confirm-new-pass">تأكيد كلمة المرور الجديدة</label>
                        <div class="input-wrapper">
                            <input type="password" id="confirm-new-pass-input" placeholder="••••••••">
                            <span class="input-icon">🔒</span>
                        </div>
                    </div>
                    <button class="action-btn" id="btn-save-pass" onclick="saveNewPassword()" style="margin-top: 10px;">إعادة تعيين كلمة المرور</button>
                </div>

                <div class="switch-mode" style="margin-top: 15px;">
                    <a id="back-to-login" onclick="backToLogin()">العودة لتسجيل الدخول</a>
                </div>
            </div>

        </div>
    </div>

    <script src="lab.js"></script>
</body>
</html>
