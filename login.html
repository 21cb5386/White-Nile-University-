<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول الأكاديمي - جامعة النيل الأبيض</title>
    <!-- استدعاء مكتبة Lottie للرسوم المتحركة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fdf6f0 0%, #faedcd 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1a1a1a;
            --text-muted: #777;
            --primary-color: #ff5722;
            --border-color: #eee;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #121212 0%, #1e1e1e 100%);
            --card-bg: rgba(30, 30, 30, 0.95);
            --text-main: #f3f4f6;
            --text-muted: #aaa;
            --primary-color: #ff5722;
            --border-color: #333;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            padding: 20px;
        }

        .container {
            display: flex;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
            max-width: 860px;
            width: 100%;
            flex-direction: column;
            animation: fadeIn 0.8s ease-in-out;
            position: relative;
            border: 1px solid var(--border-color);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* شريط التنقل العلوي المعكوس (أدوات باليسار، لجو باليمين) */
        .top-nav-bar {
            position: absolute;
            top: 20px;
            right: 25px;
            left: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .university-brand-mini {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mini-logo {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #ff5722 0%, #f4511e 100%);
            color: white;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 0.9rem;
        }

        .mini-text h4 { font-size: 0.9rem; font-weight: 800; color: var(--text-main); }
        .mini-text span { font-size: 0.65rem; color: var(--primary-color); display: block; }

        .nav-controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .home-link-btn, .language-bar select, .theme-toggle-btn {
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 12px;
            cursor: pointer;
            outline: none;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .home-link-btn:hover, .language-bar select:focus, .theme-toggle-btn:hover {
            border-color: var(--primary-color);
        }

        .animation-side {
            background: linear-gradient(135deg, rgba(255, 237, 216, 0.5) 0%, rgba(255, 216, 177, 0.5) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            min-height: 200px;
            margin-top: 65px;
        }

        #lottie-animation {
            width: 100%;
            height: 180px;
        }

        .form-side {
            padding: 35px 30px 30px 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header-text h2 {
            margin: 0 0 5px 0;
            color: var(--text-main);
            font-size: 24px;
            font-weight: 800;
        }

        .header-text p {
            margin: 0;
            color: var(--text-muted);
            font-size: 13px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 12px;
            color: var(--text-main);
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 11px 40px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            background: rgba(0,0,0,0.02);
            color: var(--text-main);
            transition: all 0.3s ease;
        }
        [data-theme="dark"] .input-wrapper input { background: #252525; }

        .input-icon {
            position: absolute;
            right: 14px;
            font-size: 15px;
            color: #aaa;
            pointer-events: none;
        }

        .toggle-password {
            position: absolute;
            left: 14px;
            cursor: pointer;
            width: 22px;
            height: 22px;
            fill: #aaa;
            transition: fill 0.2s;
        }
        .toggle-password:hover { fill: var(--primary-color); }

        .input-wrapper input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(255, 87, 34, 0.15);
        }

        .strength-meter-container {
            display: flex; gap: 5px; margin-top: 4px; height: 4px; width: 100%;
        }
        .strength-bar { flex: 1; background: #e0e0e0; border-radius: 2px; }
        .strength-text, .match-feedback-text { font-size: 11px; color: var(--text-muted); margin-top: 3px; text-align: right; }

        .extras {
            display: flex; justify-content: space-between; align-items: center; font-size: 13px;
        }
        .extras label { display: flex; align-items: center; gap: 5px; color: var(--text-muted); cursor: pointer; }
        .extras a { color: var(--primary-color); text-decoration: none; font-weight: 600; }
        .extras a:hover { text-decoration: underline; }

        .action-btn {
            background: linear-gradient(135deg, #ff5722 0%, #f4511e 100%);
            color: white; border: none; padding: 13px; border-radius: 12px;
            font-size: 15px; font-weight: bold; cursor: pointer;
            transition: all 0.25s ease; box-shadow: 0 8px 20px rgba(255, 87, 34, 0.3);
            margin-top: 5px; text-align: center; text-decoration: none; display: block;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(255, 87, 34, 0.4); }

        .switch-mode { text-align: center; font-size: 13px; color: var(--text-muted); margin-top: 5px; }
        .switch-mode a { color: var(--primary-color); font-weight: bold; cursor: pointer; text-decoration: none; }
        .switch-mode a:hover { text-decoration: underline; }

        .recaptcha-box-real {
            background: #f9f9f9; border: 1px solid #d3d3d3; border-radius: 4px;
            padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
            max-width: 304px; margin: 15px auto; box-shadow: 0 0 4px 1px rgba(0,0,0,0.08); cursor: pointer;
        }
        .recaptcha-left { display: flex; align-items: center; gap: 12px; }
        .recaptcha-checkbox {
            width: 28px; height: 28px; border: 2px solid #c1c1c1; border-radius: 2px;
            background: #fff; display: flex; justify-content: center; align-items: center; position: relative;
        }
        .recaptcha-spinner {
            width: 18px; height: 18px; border: 2.5px solid #f3f3f3; border-top: 2.5px solid #4d90fe;
            border-radius: 50%; animation: spin 0.8s linear infinite; display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .recaptcha-check-icon { display: none; color: #0f9d58; font-size: 20px; font-weight: bold; }
        .recaptcha-text { font-size: 14px; color: #222; }

        .hidden-view { display: none !important; }

        @media (min-width: 768px) {
            .container { flex-direction: row; max-width: 820px; }
            .animation-side { flex: 1; min-height: auto; margin-top: 0; }
            #lottie-animation { height: 280px; }
            .form-side { flex: 1; justify-content: center; padding: 35px; }
            .top-nav-bar { top: 15px; right: 20px; left: 20px; }
        }
    </style>
</head>
<body data-theme="light">

    <div class="container" id="main-container" dir="rtl">
        
        <!-- الشريط العلوي المعكوس (لوجو يمين، أزراع وأدوات يسار) -->
        <div class="top-nav-bar">
            <div class="university-brand-mini">
                <div class="mini-logo">IT</div>
                <div class="mini-text">
                    <h4>جامعة النيل الأبيض</h4>
                    <span>بوابة تقانة المعلومات</span>
                </div>
            </div>

            <div class="nav-controls-group">
                <a href="index.html" class="home-link-btn">الرئيسية</a>
                <div class="language-bar">
                    <select id="lang-select" onchange="changeLanguage()">
                        <option value="ar">العربية</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <button class="theme-toggle-btn" id="theme-toggle" onclick="toggleTheme()" title="الوضع الليلي">🌙</button>
            </div>
        </div>

        <div class="animation-side">
            <div id="lottie-animation"></div>
        </div>

        <div class="form-side">
            <div class="header-text" style="margin-top: 25px;">
                <h2 id="form-title">بوابة تقانة المعلومات</h2>
                <p id="form-subtitle">تسجيل الدخول الأكاديمي للطلاب.</p>
            </div>

            <!-- نموذج تسجيل الدخول / إنشاء الحساب -->
            <div id="auth-form-container">
                
                <!-- حقول إضافية للتسجيل (الاسم، الرقم الجامعي، السمستر) -->
                <div class="input-group signup-field hidden-view" id="name-group">
                    <label id="lbl-name">الاسم الكامل</label>
                    <div class="input-wrapper">
                        <input type="text" id="fullname" placeholder="مثال: محمد أحمد">
                        <span class="input-icon">👤</span>
                    </div>
                </div>

                <div class="input-group signup-field hidden-view" id="id-group">
                    <label id="lbl-id">الرقم الجامعي (ID)</label>
                    <div class="input-wrapper">
                        <input type="text" id="studentid" placeholder="مثال: IT-2026-039">
                        <span class="input-icon">🪪</span>
                    </div>
                </div>

                <div class="input-group signup-field hidden-view" id="semester-group">
                    <label id="lbl-semester">السمستر الحالي</label>
                    <div class="input-wrapper">
                        <input type="text" id="semester" placeholder="مثال: السمستر الثالث">
                        <span class="input-icon">🎓</span>
                    </div>
                </div>

                <div class="input-group">
                    <label id="lbl-email">البريد الإلكتروني الجامعي</label>
                    <div class="input-wrapper">
                        <input type="email" id="email-input" placeholder="name@example.com">
                        <span class="input-icon">✉️</span>
                    </div>
                </div>

                <div class="input-group">
                    <label id="lbl-password">كلمة المرور</label>
                    <div class="input-wrapper">
                        <input type="password" id="pass-input" placeholder="••••••••" oninput="checkPasswordStrength(this.value); checkPasswordMatch();">
                        <span class="input-icon">🔒</span>
                        <svg class="toggle-password" viewBox="0 0 24 24" 
                             onpointerdown="showPassword('pass-input', event)" onpointerup="hidePassword('pass-input', event)"
                             oncontextmenu="return false;">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </div>
                    <div id="strength-container" class="hidden-view">
                        <div class="strength-meter-container">
                            <div class="strength-bar" id="bar-1"></div>
                            <div class="strength-bar" id="bar-2"></div>
                            <div class="strength-bar" id="bar-3"></div>
                            <div class="strength-bar" id="bar-4"></div>
                        </div>
                        <div class="strength-text" id="strength-label">قوة كلمة المرور</div>
                    </div>
                </div>

                <div class="input-group signup-field hidden-view" id="confirm-pass-group">
                    <label id="lbl-confirm">تأكيد كلمة المرور</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm-pass-input" placeholder="••••••••" oninput="checkPasswordMatch()">
                        <span class="input-icon">🔒</span>
                        <svg class="toggle-password" viewBox="0 0 24 24" 
                             onpointerdown="showPassword('confirm-pass-input', event)" onpointerup="hidePassword('confirm-pass-input', event)"
                             oncontextmenu="return false;">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </div>
                    <div id="match-container" class="hidden-view">
                        <div class="match-feedback-text" id="match-label">كلمتا المرور غير متطابقتين</div>
                    </div>
                </div>

                <div class="extras" id="login-extras">
                    <label><input type="checkbox" id="remember-me-chk"> <span id="lbl-remember">تذكرني</span></label>
                    <a href="#" id="lnk-forgot" onclick="startForgotPassword()">نسيت كلمة المرور؟</a>
                </div>

                <button class="action-btn" id="submit-btn" onclick="handleSubmit()">تسجيل الدخول</button>

                <div class="switch-mode">
                    <span id="switch-text">ليس لديك حساب؟</span> 
                    <a id="switch-btn" onclick="toggleMode()">سجل الآن</a>
                </div>
            </div>

            <!-- مراحل استعادة كلمة المرور -->
            <div id="forgot-flow-container" class="hidden-view">
                <div id="step-captcha">
                    <div class="recaptcha-box-real" onclick="triggerRealCaptcha()">
                        <div class="recaptcha-left">
                            <div class="recaptcha-checkbox" id="real-captcha-box">
                                <div class="recaptcha-spinner" id="captcha-spinner"></div>
                                <span class="recaptcha-check-icon" id="captcha-check">✓</span>
                            </div>
                            <span class="recaptcha-text" id="lbl-robot">أنا لست روبوت</span>
                        </div>
                    </div>
                </div>

                <div id="step-email" class="hidden-view">
                    <div class="input-group">
                        <label id="lbl-recovery-email">أدخل بريدك الإلكتروني المسجل</label>
                        <div class="input-wrapper">
                            <input type="email" id="recovery-email-input" placeholder="name@example.com">
                            <span class="input-icon">✉️</span>
                        </div>
                    </div>
                    <button class="action-btn" id="btn-send-code" onclick="sendVerificationCode()">إرسال رمز التحقق</button>
                </div>

                <div id="step-otp" class="hidden-view">
                    <div class="input-group">
                        <label id="lbl-otp">أدخل رمز التحقق (4 أرقام)</label>
                        <div class="input-wrapper">
                            <input type="text" id="otp-input" placeholder="1234" maxlength="4">
                            <span class="input-icon">🔑</span>
                        </div>
                    </div>
                    <button class="action-btn" id="btn-verify-otp" onclick="verifyOtpCode()">التحقق من الرمز</button>
                </div>

                <div id="step-newpass" class="hidden-view">
                    <div class="input-group">
                        <label id="lbl-new-pass">كلمة المرور الجديدة</label>
                        <div class="input-wrapper">
                            <input type="password" id="new-pass-input" placeholder="••••••••">
                            <span class="input-icon">🔒</span>
                        </div>
                    </div>
                    <div class="input-group">
                        <label id="lbl-confirm-new-pass">تأكيد كلمة المرور الجديدة</label>
                        <div class="input-wrapper">
                            <input type="password" id="confirm-new-pass-input" placeholder="••••••••">
                            <span class="input-icon">🔒</span>
                        </div>
                    </div>
                    <button class="action-btn" id="btn-save-pass" onclick="saveNewPassword()">إعادة تعيين كلمة المرور</button>
                </div>

                <div class="switch-mode" style="margin-top: 15px;">
                    <a id="back-to-login" onclick="backToLogin()">العودة لتسجيل الدخول</a>
                </div>
            </div>

        </div>
    </div>

    <!-- استدعاء ملف الجافاسكريبت الخارجي -->
    <script src="lab.js"></script>
</body>
</html>
